  <g fill="none" stroke="#c9a24a" stroke-width="2.5" stroke-linecap="round">
    <path d="M44 84V48a4 4 0 0 1 4-4h36"/>
    <path d="M956 84V48a4 4 0 0 0-4-4h-36"/>
