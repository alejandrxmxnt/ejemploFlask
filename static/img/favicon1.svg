  <!-- Fondo -->
  <rect width="1000" height="320" rx="22" fill="url(#fondo)"/>
  <rect x="14" y="14" width="972" height="292" rx="14" fill="none" stroke="#c9a24a" stroke-width="2"/>
  <rect x="24" y="24" width="952" height="272" rx="8" fill="none" stroke="#c9a24a" stroke-width="1" opacity=".55"/>

